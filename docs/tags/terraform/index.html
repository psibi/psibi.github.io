<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Sibi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="/css/default.css" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JTDENDXYYY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-JTDENDXYYY');
    </script>
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="manifest" href="/images/site.webmanifest">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="site-logo">Sibi</a>
            <nav class="site-nav">
                <a href="/" class="nav-link">Home</a>
                <a href="/about.html" class="nav-link">About</a>
                <a href="/contact.html" class="nav-link">Contact</a>
                <a href="/posts/" class="nav-link">Archive</a>
                <a href="/search/" class="nav-link search-link" title="Search" aria-label="Search">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </a>
            </nav>
        </div>
    </header>

    <main class="site-content">
        
<div class="home-hero">
    <h1>Posts tagged "terraform"</h1>
    <p class="tagline">1 post</p>
</div>

<ul class="post-list">
    
        <li>
            <h2><a href="&#x2F;posts&#x2F;lsp-mode.html&#x2F;">Improvements to Terraform support for lsp-mode</a></h2>
            <span class="post-date">January  1, 2019</span>
        </li>
    
</ul>

    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <span>&copy; 2026 Sibi</span>
        </div>
    </footer>

    
    <script>
        (function() {
            document.querySelectorAll('.article-body h2, .article-body h3, .article-body h4').forEach(function(h) {
                if (!h.id) return;
                var a = document.createElement('a');
                a.href = '#' + h.id;
                a.className = 'heading-link';
                a.textContent = '#';
                a.setAttribute('aria-hidden', 'true');
                h.appendChild(a);
            });
        })();
    </script>
    <script>
        (function() {
            var path = window.location.pathname;
            var links = document.querySelectorAll('.nav-link');
            links.forEach(function(link) {
                link.classList.remove('active');
            });
            if (path === '/' || path === '') {
                links[0].classList.add('active');
            } else if (path.startsWith('/about')) {
                links[1].classList.add('active');
            } else if (path.startsWith('/contact')) {
                links[2].classList.add('active');
            } else if (path.startsWith('/posts')) {
                links[3].classList.add('active');
            } else if (path.startsWith('/search')) {
                links[4].classList.add('active');
            }
        })();
    </script>
</body>
</html>
