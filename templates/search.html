{% extends "default.html" %}

{% block content %}
<div class="search-page">
    <div class="search-input-wrapper">
        <svg class="search-input-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search posts..." autofocus autocomplete="off" />
        <kbd class="search-kbd">⌘K</kbd>
    </div>
    <div id="search-results" class="search-results">
        <p class="search-empty">Type to search across all posts.</p>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="/js/elasticlunr.min.js"></script>
<script src="/search_index.en.js"></script>
<script src="/js/search.js"></script>
{% endblock %}
