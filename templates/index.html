{% extends "default.html" %}

{% block content %}
<span class="heading-label">Recent Posts</span>

<ul class="post-index">
    {% set posts = get_section(path="posts/_index.md") %}
    {% for page in posts.pages | slice(end=6) %}
        <li>
            <h2><a href="{{ page.path }}">{{ page.title }}</a></h2>
            <span class="date">{{ page.date | date(format="%B %e, %Y") }}</span>
        </li>
    {% endfor %}
</ul>

<a href="/posts/">archives</a>
{% endblock %}
